<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>BQ</title>
	<style>
		.disc { fill: #0a0a0a; }
		.mark { fill: #ffffff; }
		/* dark browser themes: invert so the icon stays visible on a dark tab bar */
		@media (prefers-color-scheme: dark) {
			.disc { fill: #ffffff; }
			.mark { fill: #0a0a0a; }
		}
	</style>
	<circle class="disc" cx="32" cy="32" r="32" />
	<text
		class="mark"
		x="32"
		y="33"
		text-anchor="middle"
		dominant-baseline="central"
		font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
		font-size="27"
		font-weight="600"
		letter-spacing="-1"
	>BQ</text>
</svg>
